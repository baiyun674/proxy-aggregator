name: Auto Aggregate Clean Nodes

on:
  schedule:
    - cron: '0 */6 * * *'        # 每 6 小时自动运行（UTC）
  workflow_dispatch: {}            # 允许在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build-clean-sub:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Python 环境与依赖
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt

      - name: 离线自检（解析 / 亚洲保底名额 / 配置生成）
        run: python selftest.py

      - name: 下载最新 Mihomo 核心用于真实隧道穿透测试
        run: |
          set -e
          LATEST_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep "browser_download_url.*mihomo-linux-amd64-compatible-.*gz" \
            | cut -d '"' -f 4 | head -n 1)
          echo "mihomo asset: $LATEST_URL"
          curl -L "$LATEST_URL" -o mihomo.gz
          gzip -d mihomo.gz
          chmod +x mihomo
          ./mihomo -v || true

      - name: 执行真落地 + 纯净度聚合脚本（含亚洲保底）
        run: python aggregator.py

      - name: 同时导出一份 Base64 订阅（可选，便于旧客户端导入）
        run: |
          if [ -f mihomo_stable.yaml ]; then
            base64 -w0 mihomo_stable.yaml > subscription.b64 || true
          fi

      - name: 发布产物到独立 output 分支（main 保持纯净源码）
        if: always()
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先把本次产物收进临时目录，避免切分支时被覆盖
          mkdir -p /tmp/out
          for f in mihomo_stable.yaml singbox.json subscription.b64; do
            [ -f "$f" ] && cp "$f" /tmp/out/ || true
          done
          if [ -z "$(ls -A /tmp/out)" ]; then
            echo "无产物可发布，跳过"; exit 0
          fi
          # output 分支：orphan，仅放产物，不含源码
          if git ls-remote --exit-code --heads origin output >/dev/null 2>&1; then
            git fetch --no-tags origin output
            git checkout -B output FETCH_HEAD
          else
            git checkout --orphan output
          fi
          git rm -rf . >/dev/null 2>&1 || true
          # 只放产物 + .nojekyll，绝不 git add -A（否则会混入 mihomo 二进制/__pycache__/temp）
          cp /tmp/out/mihomo_stable.yaml ./mihomo_stable.yaml 2>/dev/null || true
          cp /tmp/out/singbox.json ./singbox.json 2>/dev/null || true
          cp /tmp/out/subscription.b64 ./subscription.b64 2>/dev/null || true
          # 关闭 Pages 的 Jekyll 处理，保证 yaml/json 原样可访问
          touch .nojekyll
          git add -f mihomo_stable.yaml singbox.json subscription.b64 .nojekyll 2>/dev/null || true
          git commit -m "chore: 更新节点产物 $(date -u +%Y-%m-%dT%H:%M)Z" --allow-empty || true
          git push -f origin output

      - name: 上传本次产物为 Artifact（便于不推仓库时下载）
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mihomo-clean-subscription
          path: |
            mihomo_stable.yaml
            singbox.json
            subscription.b64
          if-no-files-found: ignore
